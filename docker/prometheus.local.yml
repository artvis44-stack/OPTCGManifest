# Prometheus for the local stack (`docker compose --profile monitoring up`): the
# same scrapes as production without the host and alerting pieces, for watching
# a load test. The rules are loaded so http://localhost:9090/alerts shows what
# would fire.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: manifest-app
    dns_sd_configs:
      - names: [app]
        type: A
        port: 9464
        refresh_interval: 5s

  - job_name: manifest-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 5s
