# Prometheus for docker-compose.prod.yml's `monitoring` profile. Each app and
# worker replica serves /metrics on 9464 inside the compose network
# (MANIFEST_METRICS_LISTEN); Docker's DNS answers `app` and `worker` with every
# replica's address, so scaling up needs no change here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: manifest-app
    dns_sd_configs:
      - names: [app]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: manifest-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
