# The production shape on one machine, for trying it out and for development:
# the site and a separate worker sharing PostgreSQL, Redis and an S3 store, the
# same as docker-compose.prod.yml but with no TLS and no domain.
#
#   docker compose up --build
#   open http://localhost:8420
#
# With `--profile monitoring`, Prometheus at http://localhost:9090 scrapes the app
# and worker - useful while running the load tests in loadtest/.
#
# Accounts: set MANIFEST_INVITE_CODE in .env to sign up from the page, or
#   docker compose exec app manifest-entrypoint user add <name>

x-manifest: &manifest
  build: .
  image: manifest:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &manifest-env
    MANIFEST_ENV: Development
    MANIFEST_DATABASE_URL: postgres://manifest:manifest@postgres:5432/manifest
    MANIFEST_REDIS_URL: redis://redis:6379
    MANIFEST_OBJECT_STORAGE_ENDPOINT: http://s3:8333
    MANIFEST_OBJECT_STORAGE_BUCKET: manifest-art
    MANIFEST_OBJECT_STORAGE_ACCESS_KEY: manifest
    MANIFEST_OBJECT_STORAGE_SECRET_KEY: manifest-local-secret
    MANIFEST_WORKER_MODE: external
    MANIFEST_SCAN_MODE: async
    MANIFEST_METRICS_LISTEN: 0.0.0.0:9464
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    s3: { condition: service_started }

services:
  app:
    <<: *manifest
    command: ["--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${MANIFEST_PORT:-8420}:8420"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8420/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *manifest
    command: ["worker"]
    volumes:
      - worker-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manifest
      POSTGRES_PASSWORD: manifest
      POSTGRES_DB: manifest
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only sign-in counters live here; nothing worth writing to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  s3:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/seaweedfs.sh"]
    environment:
      S3_ACCESS_KEY: manifest
      S3_SECRET_KEY: manifest-local-secret
    volumes:
      - ./docker/seaweedfs.sh:/seaweedfs.sh:ro,Z
      - s3-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro,Z

volumes:
  app-data:
  worker-data:
  pg-data:
  s3-data:
