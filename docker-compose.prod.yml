# Manifest on a VPS: Caddy (HTTPS from Let's Encrypt) in front of app replicas,
# a worker, PostgreSQL, Redis and a self-hosted S3 store for card art. All
# settings come from .env - copy .env.example and fill it in, then:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from outside; everything else talks on the compose
# network. Monitoring - Prometheus, Alertmanager and a host exporter, with the
# alert rules in docker/alerts.yml - is opt-in:
#
#   docker compose -f docker-compose.prod.yml --profile monitoring up -d
#
# Its UIs listen on the server's loopback only; reach them over SSH:
#   ssh -L 9090:127.0.0.1:9090 -L 9093:127.0.0.1:9093 <server> To use a hosted bucket (R2, B2, S3) instead of the s3 service, set
# the MANIFEST_OBJECT_STORAGE_* variables in .env and remove the s3 service.

x-manifest: &manifest
  build: .
  image: manifest:${MANIFEST_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    MANIFEST_ENV: Production
    MANIFEST_DATABASE_URL: postgres://manifest:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/manifest
    MANIFEST_REDIS_URL: redis://redis:6379
    MANIFEST_OBJECT_STORAGE_ENDPOINT: ${MANIFEST_OBJECT_STORAGE_ENDPOINT:-http://s3:8333}
    MANIFEST_OBJECT_STORAGE_BUCKET: ${MANIFEST_OBJECT_STORAGE_BUCKET:-manifest-art}
    MANIFEST_OBJECT_STORAGE_ACCESS_KEY: ${MANIFEST_OBJECT_STORAGE_ACCESS_KEY:-manifest}
    MANIFEST_OBJECT_STORAGE_SECRET_KEY: ${MANIFEST_OBJECT_STORAGE_SECRET_KEY:?set MANIFEST_OBJECT_STORAGE_SECRET_KEY in .env}
    MANIFEST_PUBLIC_URL: https://${MANIFEST_DOMAIN:?set MANIFEST_DOMAIN in .env}
    MANIFEST_WORKER_MODE: external
    # /metrics for Prometheus, on the compose network only: Caddy forwards 8420.
    MANIFEST_METRICS_LISTEN: 0.0.0.0:9464
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      MANIFEST_DOMAIN: ${MANIFEST_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }

  app:
    <<: *manifest
    deploy:
      replicas: ${APP_REPLICAS:-2}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8420/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  worker:
    <<: *manifest
    command: ["worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    volumes:
      - worker-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manifest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: manifest
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  s3:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/seaweedfs.sh"]
    environment:
      S3_ACCESS_KEY: ${MANIFEST_OBJECT_STORAGE_ACCESS_KEY:-manifest}
      S3_SECRET_KEY: ${MANIFEST_OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - ./docker/seaweedfs.sh:/seaweedfs.sh:ro,Z
      - s3-data:/data

  # ---- monitoring (profile) ----------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - prom-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/alertmanager.sh"]
    # Mails alerts to MANIFEST_ALERT_EMAIL through the same SMTP settings the
    # app uses. Unset, alerts only show at http://127.0.0.1:9093.
    environment:
      MANIFEST_ALERT_EMAIL: ${MANIFEST_ALERT_EMAIL:-}
      MANIFEST_SMTP_HOST: ${MANIFEST_SMTP_HOST:-}
      MANIFEST_SMTP_PORT: ${MANIFEST_SMTP_PORT:-587}
      MANIFEST_SMTP_USER: ${MANIFEST_SMTP_USER:-}
      MANIFEST_SMTP_PASSWORD: ${MANIFEST_SMTP_PASSWORD:-}
      MANIFEST_SMTP_FROM: ${MANIFEST_SMTP_FROM:-}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./docker/alertmanager.sh:/alertmanager.sh:ro,Z
      - am-data:/alertmanager

  # Disk, memory and CPU of the VPS itself, plus the backup scripts' results:
  # they write *.prom files into backups/, read here as textfile metrics.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ./backups:/textfile:ro,z

volumes:
  caddy-data:
  caddy-config:
  app-data:
  worker-data:
  pg-data:
  s3-data:
  prom-data:
  am-data:
